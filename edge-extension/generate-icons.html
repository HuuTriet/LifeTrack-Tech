<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body>
<canvas id="c16" width="16" height="16"></canvas>
<canvas id="c48" width="48" height="48"></canvas>
<canvas id="c128" width="128" height="128"></canvas>
<script>
function drawIcon(size) {
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Background
  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#2E5C7F');
  grad.addColorStop(1, '#4A8FB8');
  ctx.fillStyle = grad;
  const r = size * 0.2;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fill();

  // Pill cross symbol
  ctx.fillStyle = 'white';
  const cx = size / 2, cy = size / 2;
  const arm = size * 0.1, half = size * 0.28;
  // horizontal bar
  ctx.fillRect(cx - half, cy - arm, half * 2, arm * 2);
  // vertical bar
  ctx.fillRect(cx - arm, cy - half, arm * 2, half * 2);

  return canvas.toDataURL('image/png');
}

[16, 48, 128].forEach(s => {
  const a = document.createElement('a');
  a.href = drawIcon(s);
  a.download = `icon${s}.png`;
  a.textContent = `Download icon${s}.png`;
  document.body.appendChild(a);
  document.body.appendChild(document.createElement('br'));
});
</script>
</body>
</html>
